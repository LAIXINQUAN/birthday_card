<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ邮箱祝你生日快乐</title>
<style>
/* ===== Design tokens：沿用QQ生日邮件官方配色 ===== */
:root{
  --space-xs:4px; --space-sm:8px; --space-md:16px;
  --space-lg:32px; --space-xl:45px;
  --color-primary:#4f99ee;        /* QQ邮箱按钮蓝 */
  --color-text-body:#333;          /* 原邮件正文深灰 */
  --color-bg-page:#ffe7f0;         /* 页面底色：延续邮件淡粉底 */
  --color-card:#fff;
  --font-body:'Lucida Grande','Verdana','Microsoft YaHei',sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  font-family:var(--font-body);
  font-size:14px;
  color:var(--color-text-body);
  background:var(--color-bg-page);
  display:flex;align-items:center;justify-content:center;
  overflow-x:hidden;
}

/* ===== 主卡片：对应邮件中 table_wrap 白底容器 ===== */
.card{
  width:min(94vw,600px);
  background:var(--color-card);
  border-radius:10px;
  box-shadow:0 10px 34px rgba(79,153,238,.22);
  overflow:hidden;
  animation:cardIn .8s ease;
}
@keyframes cardIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

/* ===== 顶部蛋糕舞台横幅：对应 mobile_stage 图 ===== */
.banner{position:relative;text-align:center;background:linear-gradient(180deg,#fdf3f7,#fff)}
.banner img{width:100%;display:block}
.banner .bg-cnt{position:absolute;left:0;right:0;top:0;bottom:0;z-index:1;pointer-events:none}

/* ===== 内容区 ===== */
.content{padding:var(--space-sm) 4% var(--space-lg)}
.content h2{margin:var(--space-xs) 2%;font-size:14px;font-weight:normal}
.content p{
  margin:0 2%;line-height:1.7;text-align:justify;
  font-size:14px;color:var(--color-text-body);
}

/* ===== 按钮：原邮件 button_send 的样式 ===== */
.btn{
  display:block;margin:25px auto 30px;
  background-color:var(--color-primary);
  border-radius:4px;color:#fff;
  height:35px;line-height:35px;
  font-size:15px;text-align:center;
  text-decoration:none;cursor:pointer;
  max-width:140px;width:140px;
  transition:filter .2s,transform .15s;
  border:none;user-select:none;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}

/* ===== 底部QQ邮箱logo区 ===== */
.footer-brand{text-align:right;padding:0 4% var(--space-sm)}
.footer-brand img{width:17%;min-width:60px;margin-bottom:1%;opacity:.85;filter:saturate(.8) blur(.3px);mix-blend-mode:multiply}
.credit{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:#b09aa8;z-index:1;letter-spacing:.1em}

/* ===== 许愿弹层 ===== */
.wish-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,240,247,.5);backdrop-filter:blur(3px);z-index:50}
.wish-overlay p{
  font-size:clamp(26px,6vw,44px);font-weight:bold;color:var(--color-primary);
  text-shadow:0 2px 14px rgba(79,153,238,.45);
  background:rgba(255,255,255,.9);padding:22px 40px;border-radius:12px;
  animation:wpop .6s cubic-bezier(.22,1,.36,1);
}
@keyframes wpop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* ===== 彩带 ===== */
.confetti{position:fixed;top:-24px;z-index:60;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(108vh) rotate(680deg);opacity:.15}}

/* ===== 烛光粒子/流星画布 ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:55}

/* ===== 气球 ===== */
.balloon{position:fixed;bottom:-90px;z-index:58;pointer-events:none;animation:rise linear forwards}
.balloon .skin{
  display:block;width:44px;height:54px;
  border-radius:50% 50% 50% 50%/44% 44% 56% 56%;
}
.balloon .string{display:block;width:1.5px;height:56px;margin:0 auto;opacity:.5}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) rotate(-3deg)}
  25%{transform:translateY(-28vh) translateX(14px) rotate(3deg)}
  50%{transform:translateY(-56vh) translateX(-10px) rotate(-3deg)}
  75%{transform:translateY(-84vh) translateX(12px) rotate(2deg)}
  100%{transform:translateY(-115vh) translateX(0) rotate(0);opacity:.6}
}

/* ===== 逐字点亮 ===== */
.glow-text b{opacity:0;display:inline-block;animation:charIn .5s cubic-bezier(.22,1,.36,1) forwards}
@keyframes charIn{
  from{opacity:0;transform:translateY(8px);filter:blur(4px)}
  to{opacity:1;transform:none;filter:none}
}

/* ===== 蛋糕：开源经典方案——层叠+奶油裱花圆点+竖纹 ===== */
.cake-scene{
  margin:var(--space-md) auto var(--space-xs);
  width:280px;height:300px;
  position:relative;
}
.cake-wrap{position:absolute;inset:0}
.lyr{
  position:absolute;left:50%;
  border-radius:12px 12px 0 0;
  background-image:
    linear-gradient(transparent 62%,rgba(120,60,20,.28) 62%,rgba(120,60,20,.28) 72%,transparent 72%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 14px,transparent 14px 28px);
}
.lyr-1{
  width:260px;height:86px;bottom:0;margin-left:-130px;z-index:1;
  background-color:#fcdda4;
  box-shadow:inset 0 -12px 16px rgba(180,120,60,.25),0 4px 8px rgba(120,80,40,.2);
}
.lyr-2{
  width:220px;height:76px;bottom:82px;margin-left:-110px;z-index:2;
  background-color:#f9b8a0;
  box-shadow:inset 0 -10px 14px rgba(200,100,80,.25),0 4px 8px rgba(180,100,60,.18);
}
.lyr-3{
  width:180px;height:66px;bottom:152px;margin-left:-90px;z-index:3;
  background-color:#85b6bf;
  box-shadow:inset 0 -10px 14px rgba(50,90,110,.3),0 4px 8px rgba(60,90,120,.18);
}
/* 奶油裱花圆点：环绕每层顶部边缘 */
.butter{position:absolute;top:-8px;left:0;right:0;display:flex;justify-content:space-around;z-index:2}
.butter-circle{
  width:22px;height:16px;border-radius:50% 50% 40% 40%;
  background:radial-gradient(circle at 35% 30%,#fff 25%,#ffe9f0 60%,#f8d7e2 100%);
  box-shadow:inset 0 -3px 4px rgba(200,140,160,.4),0 2px 3px rgba(120,60,90,.15);
}
.lyr-2 .butter-circle{
  background:radial-gradient(circle at 35% 30%,#fff 25%,#fff6e8 60%,#f5e0c5 100%);
  box-shadow:inset 0 -3px 4px rgba(200,160,100,.4),0 2px 3px rgba(150,110,60,.15);
}
.lyr-3 .butter-circle{
  background:radial-gradient(circle at 35% 30%,#fff 25%,#e8f4f8 60%,#c8e4ec 100%);
  box-shadow:inset 0 -3px 4px rgba(90,130,150,.35),0 2px 3px rgba(60,90,120,.15);
}
.lyr-3::after{
  content:'';position:absolute;left:6%;right:6%;top:-12px;height:20px;z-index:1;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 65%,#fff 30%,#eef7fa 70%,#d5eaf2 100%);
}
.plate{
  position:absolute;bottom:-10px;left:50%;width:300px;height:22px;margin-left:-150px;z-index:0;
  border-radius:50%;
  background:linear-gradient(180deg,#fdfdff,#dde7f5);
  box-shadow:0 10px 18px rgba(100,120,180,.3);
}
.candle-col{position:absolute;bottom:214px;left:50%;display:flex;gap:22px;margin-left:-46px;z-index:10}
.c3-wrap{position:relative;width:14px;cursor:pointer}
.c3-candle{
  width:14px;height:48px;border-radius:7px/4px;
  background:repeating-linear-gradient(45deg,#ff593f 0,#ff593f 5px,#ffd0c8 5px,#ffd0c8 10px);
  box-shadow:inset -2px 0 3px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.15);
}
.c3-wrap .wick{position:absolute;top:-6px;left:6px;width:2px;height:7px;background:#222;border-radius:1px}
.c3-flame{
  position:absolute;top:-28px;left:-9px;width:32px;height:44px;cursor:pointer;
  transition:opacity .4s,transform .4s;
}
.c3-flame .flm{
  position:absolute;width:32px;height:32px;border-radius:50%;
  background:currentColor;
}
.c3-flame .flm::before{
  content:'';position:absolute;width:32px;height:8px;left:-16px;top:-8px;
  border-radius:0 0 0 100%;
  border-bottom:32px solid currentColor;
}
.c3-flame .f-red{color:red;top:16px;opacity:.65;animation:burn-red 1s linear infinite}
.c3-flame .f-orange{color:orange;top:0;opacity:.8;box-shadow:0 0 16px orange;animation:burn-orange .4s linear infinite}
.c3-flame .f-yellow{color:yellow;top:-16px;opacity:.9;box-shadow:0 0 16px yellow;animation:burn-yellow 1.6s linear infinite}
.c3-flame .f-white{color:#fff;top:-32px;box-shadow:0 0 16px #fff;animation:burn-white 1.8s linear infinite}
@keyframes burn-red{
  0%{transform:rotate(120deg) skewX(0) scale(1.2)}
  20%{transform:rotate(118deg) skewX(5deg) scale(1.3)}
  40%{transform:rotate(120deg) skewX(0) scale(1.2)}
  60%{transform:rotate(122deg) skewX(-5deg) scale(1.3)}
  100%{transform:rotate(120deg) skewX(0) scale(1.2)}
}
@keyframes burn-orange{
  0%{transform:rotate(65deg) skewX(0) scale(1.2)}
  20%{transform:rotate(60deg) skewX(-15deg) scale(1.3)}
  40%{transform:rotate(65deg) skewX(0) scale(1.2)}
  60%{transform:rotate(70deg) skewX(2deg) scale(1.3)}
  100%{transform:rotate(65deg) skewX(0) scale(1.2)}
}
@keyframes burn-yellow{
  0%{transform:rotate(120deg) skewX(0) scale(.9)}
  20%{transform:rotate(110deg) skewX(10deg) scale(1)}
  40%{transform:rotate(120deg) skewX(0) scale(.9)}
  60%{transform:rotate(130deg) skewX(-10deg) scale(1)}
  100%{transform:rotate(120deg) skewX(0) scale(.9)}
}
@keyframes burn-white{
  0%{transform:rotate(60deg) skewX(0) scale(.55)}
  20%{transform:rotate(50deg) skewX(-3deg) scale(.65)}
  40%{transform:rotate(60deg) skewX(0) scale(.55)}
  60%{transform:rotate(70deg) skewX(3deg) scale(.65)}
  100%{transform:rotate(60deg) skewX(0) scale(.55)}
}
.c3-out .c3-flame{opacity:0;transform:scale(.2) translateY(10px)}
.smoke{
  position:absolute;top:-26px;left:5px;width:6px;height:6px;border-radius:50%;
  background:rgba(150,150,160,.5);
  animation:smokeUp 1.6s ease-out forwards;pointer-events:none;
}
@keyframes smokeUp{
  from{transform:translateY(0) rotate(0) scale(1);opacity:.6}
  to{transform:translateY(-46px) translateX(10px) rotate(360deg) scale(4);opacity:0}
}

/* ===== 孔明灯（许愿灯） ===== */
.lantern{
  position:fixed;bottom:-120px;z-index:62;pointer-events:none;
  animation:lanternRise linear forwards;
}
.lantern .body{
  display:block;width:34px;height:46px;border-radius:45% 45% 50% 50%/55% 55% 45% 45%;
  background:radial-gradient(circle at 50% 75%,rgba(255,220,140,.95),rgba(255,150,60,.75) 60%,rgba(230,110,40,.5));
  box-shadow:0 0 26px 10px rgba(255,190,90,.35),inset 0 -8px 12px rgba(255,240,190,.8);
}
.lantern .cap{display:block;width:16px;height:5px;margin:0 auto;border-radius:3px;background:#c98a4b}
@keyframes lanternRise{
  0%{transform:translateY(0) translateX(0) scale(.5);opacity:0}
  12%{opacity:1;transform:translateY(-8vh) translateX(6px) scale(1)}
  50%{transform:translateY(-55vh) translateX(-12px)}
  100%{transform:translateY(-118vh) translateX(8px) scale(.7);opacity:0}
}

/* ===== 开花动画 ===== */
.bloom{position:fixed;z-index:57;pointer-events:none;animation:bloomOpen 2.4s ease-out forwards}
.bloom .petal-ring{position:relative;width:60px;height:60px;transform-origin:center;animation:bloomSpin 2.4s linear}
.bloom .petal{
  position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
  border-radius:50% 0 50% 50%;
  background:linear-gradient(135deg,rgba(255,150,190,.9),rgba(255,200,120,.7));
  transform-origin:center;
}
@keyframes bloomOpen{
  0%{transform:scale(0) rotate(0);opacity:0}
  30%{transform:scale(1) rotate(60deg);opacity:1}
  100%{transform:scale(1.4) rotate(200deg) translateY(-30px);opacity:0}
}
@keyframes bloomSpin{to{transform:rotate(360deg)}}

/* ===== 星尘拖尾 ===== */
.trail-dot{
  position:fixed;width:6px;height:6px;border-radius:50%;z-index:56;
  pointer-events:none;animation:trailFade .7s ease-out forwards;
}
@keyframes trailFade{
  from{transform:scale(1);opacity:.9}
  to{transform:scale(2.6) translateY(-14px);opacity:0}
}

/* ===== 许愿输入弹窗 ===== */
.wish-dialog{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:rgba(60,40,60,.35);backdrop-filter:blur(4px);
}
.wish-dialog .panel{
  background:#fff;border-radius:14px;padding:var(--space-lg) var(--space-lg) var(--space-md);
  width:min(88vw,360px);text-align:center;
  box-shadow:0 20px 50px rgba(100,60,100,.3);
  animation:wpop .5s cubic-bezier(.22,1,.36,1);
}
.wish-dialog .panel h3{font-size:16px;color:var(--color-text-body);margin-bottom:var(--space-sm)}
.wish-dialog .panel p.tip{font-size:12px;color:#a08a98;margin-bottom:var(--space-md)}
.wish-dialog input{
  width:100%;height:42px;border:1.5px solid #e8d5e0;border-radius:8px;
  padding:0 var(--space-md);font-size:15px;outline:none;text-align:center;
  transition:border-color .2s;
}
.wish-dialog input:focus{border-color:var(--color-primary)}
.wish-dialog .actions{margin-top:var(--space-md);display:flex;gap:var(--space-sm);justify-content:center}
.wish-dialog .actions button{
  height:36px;padding:0 var(--space-lg);border:none;border-radius:8px;
  font-size:14px;cursor:pointer;transition:filter .2s,transform .15s;
}
.wish-dialog .actions .ok{background:var(--color-primary);color:#fff}
.wish-dialog .actions .skip{background:#f2e6ee;color:#8a7080}
.wish-dialog .actions button:hover{filter:brightness(1.06)}
.wish-dialog .actions button:active{transform:scale(.97)}

@media (max-width:480px){
  .content p{text-align:left}
  /* 蛋糕区整体下移，避开段落文字与火焰重叠 */
  .cake-scene{margin-top:calc(var(--space-lg) + 12px)}
  /* 火焰点击热区也下移对齐 */
  .candle-col{bottom:210px}
  .plate{width:280px;margin-left:-140px}
}
</style>
</head>

<script>
(function(){
  'use strict';

  var CONFETTI_CHARS=['🎉','🎊','🎈','⭐','🎂','💖'];
  var BALLOON_COLORS=['#ff8fa8','#8fd3ff','#ffe08f','#b28dff','#8fe8c0','#ff9a76'];
  var NOTE_FREQ={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
  var MELODY=[
    ['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
    ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
    ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
    ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]
  ];
  var BEAT=.42;
  var METEOR_MAX=6;      /* 同屏流星上限 */
  var SPARK_MAX=18;      /* 同屏烛光粒子上限 */
  var CHORD_OFFSETS=[2,0.5];  /* 合唱声部：高八度、低八度 */

  function later(fn,ms){return setTimeout(fn,ms);}

  /* ===== URL 名字：支持 ?name=xxx 与 #xxx 两种写法 ===== */
  function applyNameParam(){
    var name=null;
    try{
      name=new URLSearchParams(window.location.search).get('name');
      if(!name && window.location.hash.length>1){
        name=decodeURIComponent(window.location.hash.slice(1));
      }
    }catch(e){name=null;}
    if(!name)return;
    var h2=document.querySelector('.content h2');
    if(h2)h2.textContent='Hi，'+name+'，';
  }
  applyNameParam();

  /* ===== Canvas特效：顶部流星 + 烛光粒子 ===== */
  var canvas=document.getElementById('fx');
  var ctx=canvas.getContext('2d');
  var meteors=[];
  var sparks=[];
  var candlesLit=false;  /* 点击开始后点燃 */

  function fitCanvas(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
  }
  window.addEventListener('resize',fitCanvas);
  fitCanvas();

  function spawnMeteor(){
    meteors.push({
      x:Math.random()*canvas.width*.8+canvas.width*.1,
      y:-10,
      vx:-(1.2+Math.random()*1.4),
      vy:2.2+Math.random()*1.6,
      len:40+Math.random()*50,
      hue:Math.random()*60+20,
      life:1
    });
  }
  function spawnSpark(){
    sparks.push({
      x:canvas.width/2+(Math.random()*120-60),
      y:canvas.height*.35+Math.random()*40,
      vx:Math.random()*.4-.2,
      vy:-(.4+Math.random()*.5),
      r:1+Math.random()*1.8,
      life:1
    });
  }

  function step(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(Math.random()<.06 && meteors.length<METEOR_MAX)spawnMeteor();
    meteors.forEach(function(m){
      var grad=ctx.createLinearGradient(m.x,m.y,m.x+m.len,m.y-m.len);
      grad.addColorStop(0,'hsla('+m.hue+',95%,70%,.9)');
      grad.addColorStop(1,'hsla('+m.hue+',95%,70%,0)');
      ctx.strokeStyle=grad;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(m.x,m.y);
      ctx.lineTo(m.x+m.len,m.y-m.len);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(m.x,m.y,2,0,Math.PI*2);
      ctx.fillStyle='rgba(255,250,220,'+m.life+')';
      ctx.fill();
      m.x+=m.vx;m.y+=m.vy;m.life-=.008;
    });
    meteors=meteors.filter(function(m){return m.life>0&&m.y<canvas.height+60;});

    if(candlesLit && sparks.length<SPARK_MAX && Math.random()<.5)spawnSpark();
    sparks.forEach(function(s){
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,200,90,'+(s.life*.8)+')';
      ctx.fill();
      s.x+=s.vx;s.y+=s.vy;s.life-=.012;s.r*=.995;
    });
    sparks=sparks.filter(function(s){return s.life>0;});

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  /* ===== 逐字点亮祝福语 ===== */
  function lightUpText(){
    var p=document.getElementById('wishText');
    var text=p.textContent;
    p.textContent='';
    Array.prototype.forEach.call(text,function(ch,i){
      var b=document.createElement('b');
      b.textContent=ch;
      b.style.animationDelay=(i*.05)+'s';
      p.appendChild(b);
    });
  }
  later(lightUpText,600);

  /* ===== 彩带雨 ===== */
  function rainConfetti(){
    for(var i=0;i<60;i++){
      var piece=document.createElement('div');
      piece.className='confetti';
      piece.textContent=CONFETTI_CHARS[Math.floor(Math.random()*CONFETTI_CHARS.length)];
      piece.style.left=Math.random()*100+'vw';
      piece.style.fontSize=(14+Math.random()*18)+'px';
      piece.style.animationDuration=(2.5+Math.random()*2.5)+'s';
      piece.style.animationDelay=(Math.random()*1.5)+'s';
      document.body.appendChild(piece);
      later(function(node){return function(){node.remove();};}(piece),8000);
    }
  }

  /* ===== 气球放飞 ===== */
  function releaseBalloons(count){
    for(var i=0;i<count;i++){
      later(function(idx){
        return function(){
          var b=document.createElement('div');
          b.className='balloon';
          var color=BALLOON_COLORS[idx%BALLOON_COLORS.length];
          var skin=document.createElement('span');
          skin.className='skin';
          skin.style.background='radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 8%,'+color+' 42%)';
          skin.style.boxShadow='inset -4px -6px 10px rgba(0,0,0,.12)';
          var str=document.createElement('span');
          str.className='string';
          str.style.background=color;
          b.appendChild(skin);
          b.appendChild(str);
          b.style.left=(4+Math.random()*92)+'vw';
          b.style.animationDuration=(7+Math.random()*5)+'s';
          document.body.appendChild(b);
          later(function(node){return function(){node.remove();};}(b),13000);
        };
      }(i), i*260);
    }
  }

  /* ===== 许愿弹层 ===== */
  function showWishOverlay(){
    var overlay=document.createElement('div');
    overlay.className='wish-overlay';
    var p=document.createElement('p');
    p.textContent='🎂 生日快乐！';
    overlay.appendChild(p);
    document.body.appendChild(overlay);
    later(function(){overlay.remove();},3800);
  }

  /* ===== 生日歌（含合唱声部） ===== */
  function playMelody(ctx){
    var t=ctx.currentTime+.1;
    MELODY.forEach(function(step){
      var baseFreq=NOTE_FREQ[step[0]];
      var dur=step[1]*BEAT;
      /* 主旋律 + 和声声部 */
      [baseFreq].concat(CHORD_OFFSETS.map(function(m){return baseFreq*m;})).forEach(function(freq,vi){
        var osc=ctx.createOscillator(),gain=ctx.createGain();
        osc.type=vi===0?'triangle':'sine';
        osc.frequency.value=freq;
        var vol=vi===0?.28:.06;
        gain.gain.setValueAtTime(0,t);
        gain.gain.linearRampToValueAtTime(vol,t+.02);
        gain.gain.setValueAtTime(vol,t+Math.max(.03,dur-.06));
        gain.gain.linearRampToValueAtTime(0,t+dur);
        osc.connect(gain);gain.connect(ctx.destination);
        osc.start(t);osc.stop(t+dur);
      });
      t+=dur;
    });
    return (t-ctx.currentTime)*1000+300;
  }

  /* ===== 鼠标/触摸星尘拖尾 ===== */
  var trailThrottle=0;
  function spawnTrail(x,y){
    var dot=document.createElement('div');
    dot.className='trail-dot';
    dot.style.left=(x-3)+'px';
    dot.style.top=(y-3)+'px';
    var hue=Math.random()*40+15;
    dot.style.background='radial-gradient(circle,hsla('+hue+',95%,70%,.95),hsla('+hue+',95%,70%,0))';
    document.body.appendChild(dot);
    later(function(node){return function(){node.remove();};}(dot),700);
  }
  window.addEventListener('pointermove',function(e){
    var now=Date.now();
    if(now-trailThrottle<40)return;
    trailThrottle=now;
    spawnTrail(e.clientX,e.clientY);
  });

  /* ===== 开花动画：从指定位置绽放 ===== */
  function bloomAt(x,y){
    var b=document.createElement('div');
    b.className='bloom';
    b.style.left=(x-30)+'px';
    b.style.top=(y-30)+'px';
    var ring=document.createElement('div');
    ring.className='petal-ring';
    for(var i=0;i<6;i++){
      var petal=document.createElement('span');
      petal.className='petal';
      petal.style.transform='rotate('+(i*60)+'deg) translateY(-22px)';
      ring.appendChild(petal);
    }
    b.appendChild(ring);
    document.body.appendChild(b);
    later(function(node){return function(){node.remove();};}(b),2500);
  }

  /* ===== 孔明灯 ===== */
  function releaseLantern(wishText){
    var l=document.createElement('div');
    l.className='lantern';
    var body=document.createElement('span');
    body.className='body';
    if(wishText)body.title=wishText;
    var cap=document.createElement('span');
    cap.className='cap';
    l.appendChild(body);l.appendChild(cap);
    l.style.left=(10+Math.random()*80)+'vw';
    l.style.animationDuration=(11+Math.random()*5)+'s';
    document.body.appendChild(l);
    later(function(node){return function(){node.remove();};}(l),17000);
  }
  function releaseLanterns(count){
    for(var i=0;i<count;i++){
      later(function(){releaseLantern();},i*400);
    }
  }

  /* ===== 许愿输入弹窗 ===== */
  function askWish(){
    var dlg=document.createElement('div');
    dlg.className='wish-dialog';
    var panel=document.createElement('div');
    panel.className='panel';
    var h3=document.createElement('h3');
    h3.textContent='🎂 许个愿吧';
    var tip=document.createElement('p');
    tip.className='tip';
    tip.textContent='写下你的愿望，它会随孔明灯升上夜空（仅保存在本页面，不会上传）';
    var input=document.createElement('input');
    input.type='text';
    input.maxLength=30;
    input.placeholder='我的愿望是…';
    var actions=document.createElement('div');
    actions.className='actions';
    var ok=document.createElement('button');
    ok.className='ok';
    ok.type='button';
    ok.textContent='放飞愿望';
    var skip=document.createElement('button');
    skip.className='skip';
    skip.type='button';
    skip.textContent='跳过';
    actions.appendChild(ok);
    actions.appendChild(skip);
    panel.appendChild(h3);
    panel.appendChild(tip);
    panel.appendChild(input);
    panel.appendChild(actions);
    dlg.appendChild(panel);
    document.body.appendChild(dlg);
    input.focus();

    function close(){dlg.remove();}
    function confirmWish(){
      var text=input.value.trim();
      close();
      releaseLantern(text||'祝你生日快乐');
      releaseLanterns(7);
      var r=panel.getBoundingClientRect();
      bloomAt(window.innerWidth/2,window.innerHeight/2);
    }
    ok.addEventListener('click',confirmWish);
    skip.addEventListener('click',close);
    input.addEventListener('keydown',function(e){
      if(e.key==='Enter')confirmWish();
      if(e.key==='Escape')close();
    });
  }

  /* ===== 吹蜡烛 ===== */
  var cake=document.getElementById('c3candles');
  var blownCount=0;
  cake.addEventListener('click',function(e){
    var wrap=e.target.closest('.c3-wrap');
    if(!wrap||wrap.dataset.lit!=='1')return;
    wrap.dataset.lit='0';
    wrap.classList.add('c3-out');
    var smoke=document.createElement('span');
    smoke.className='smoke';
    wrap.appendChild(smoke);
    later(function(node){return function(){node.remove();};}(smoke),1700);
    blownCount++;
    if(blownCount===3){
      later(function(){
        bloomAt(window.innerWidth/2,window.innerHeight/2);
        releaseLanterns(9);
        showFinaleOverlay();
      },500);
    }
  });
  function showFinaleOverlay(){
    var overlay=document.createElement('div');
    overlay.className='wish-overlay';
    var p=document.createElement('p');
    p.textContent='🕯 愿望成真！';
    overlay.appendChild(p);
    document.body.appendChild(overlay);
    later(function(){overlay.remove();},3800);
  }

  /* ===== 启动 ===== */
  var btn=document.getElementById('playBtn');
  var playing=false;
  var TEXT_PLAYING='播放中…';
  var TEXT_REPLAY='再听一遍';

  btn.addEventListener('click',function(){
    if(playing)return;
    playing=true;
    btn.textContent=TEXT_PLAYING;
    candlesLit=true;

    var audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var totalMs=playMelody(audioCtx);

    rainConfetti();
    releaseBalloons(10);
    showWishOverlay();
    later(askWish,2000);

    later(function(){
      playing=false;
      btn.textContent=TEXT_REPLAY;
      audioCtx.close();
      candlesLit=false;
    },totalMs);
  });
})();
</script>
</body>
</html>
